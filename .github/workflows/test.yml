name: Test

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and Test
        id: build
        run: ./gradlew build
        working-directory: document-plugin
        continue-on-error: true

      # DOC-CI-DIAG — a red run must be diagnosable from the outside: the job
      # logs require admin rights, but check-run annotations are public. One
      # annotation per failing test case, then fail the job.
      - name: Report failing tests
        if: steps.build.outcome == 'failure'
        working-directory: document-plugin
        shell: bash
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            while IFS= read -r test; do
              echo "::error title=${file##*/}::${test}"
              found=1
            done < <(awk '/<testcase /{n=$0; sub(/.*name="/,"",n); sub(/".*/,"",n)} /<failure/{print n}' "$file")
          done < <(grep -rl '<failure' build/test-results 2>/dev/null || true)
          if [ "$found" -eq 0 ]; then
            echo "::error title=build::Build failed without a test failure (see the Gradle log)"
          fi
          exit 1

      - name: Verify publishToMavenLocal (POM)
        if: steps.build.outcome == 'success'
        run: ./gradlew publishToMavenLocal
        working-directory: document-plugin

  # DOC-CI-ISOLATION-4 — release gate. Publishing to Maven Central happens only
  # from a `v*` tag, after the test job is green, and only when a GPG key is
  # imported: Central rejects unsigned artefacts and a plain test job has no key
  # (the conventions plugin skips signing there). CCCP_PUBLISH re-enables signing
  # for this job; OSSRH secrets are materialised into ~/.gradle/gradle.properties,
  # which is where settings.gradle.kts reads them. Locked by document.ci.ReleaseWorkflow.
  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Import GPG key
        id: import-gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Configure Maven Central credentials
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<EOF
          ossrhUsername=${{ secrets.OSSRH_USERNAME }}
          ossrhPassword=${{ secrets.OSSRH_PASSWORD }}
          signing.useGpgCmd=true
          signing.keyId=${{ steps.import-gpg.outputs.keyid }}
          EOF

      - name: Publish to Maven Central
        run: ./gradlew publishAggregationToCentralPortal --no-daemon
        working-directory: document-plugin
        env:
          CI: "true"
          CCCP_PUBLISH: "true"
