name: Test

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

# DOC-TEST-PERF (US-1) — measured on run 41745186552 (2026-11-04):
#   * the 30 dedicated Cucumber runners ran from 00:15:37 to 00:23:24 (~8 min) ;
#   * the aggregate `cucumberTest` then re-ran the same 30 tag-scoped suites
#     from 00:23:24 to 00:39:22 (~16 min of pure duplication) ;
#   * total `./gradlew build` = 29m26s in a single job.
# The layers are now separated into parallel jobs and the BDD layer is sharded
# (disjoint groups of the existing runners). `check` is not invoked, so the
# duplicated aggregate no longer runs in CI; every scenario still runs exactly
# once through its focused runner.
jobs:
  static:
    name: Static (ktlint + validatePlugins)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify Gradle wrapper version
        uses: cccp-education/conventions-gradle/.github/actions/verify-gradle-wrapper@main
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Lint and plugin validation
        run: ./gradlew ktlintCheck validatePlugins
        working-directory: document-plugin

  unit:
    name: Unit (test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify Gradle wrapper version
        uses: cccp-education/conventions-gradle/.github/actions/verify-gradle-wrapper@main
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew test
        working-directory: document-plugin

  functional:
    name: Functional shard ${{ matrix.shard }} (TestKit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: a
            tests: >-
              --tests "document.AssembleBook*"
              --tests "document.Book*"
              --tests "document.Collect*"
          - shard: b
            tests: >-
              --tests "document.Convert*"
              --tests "document.Document*"
              --tests "document.ReleaseNotes*"
              --tests "document.Table*"
              --tests "document.translation.*"
              --tests "document.Validate*"
    steps:
      - uses: actions/checkout@v4
      - name: Verify Gradle wrapper version
        uses: cccp-education/conventions-gradle/.github/actions/verify-gradle-wrapper@main
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Functional tests (shard ${{ matrix.shard }})
        run: ./gradlew functionalTest ${{ matrix.tests }}
        working-directory: document-plugin

  bdd:
    name: BDD shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: a
            tasks: >-
              n3PipelineCucumberTest tableSemanticCucumberTest articleTreeCucumberTest
              bookTreeCucumberTest bookImagesCucumberTest preserveCucumberTest
              tableTranslationCucumberTest
          - shard: b
            tasks: >-
              frontmatterRetranslateCucumberTest includeGuardCucumberTest
              n3CollectCustomCucumberTest bookMatterCucumberTest
              bookNavigationCucumberTest bookTranslateCucumberTest
              bookMultilangCucumberTest
          - shard: c
            tasks: >-
              converterSafeModeCucumberTest xrefValidationCucumberTest
              metadataValidationCucumberTest securityPolicyCucumberTest
              bookPublishCucumberTest bookValidationCucumberTest releaseGateCucumberTest
          - shard: d
            tasks: >-
              pdfCheckCucumberTest epubCheckCucumberTest documentValidationCucumberTest
              ocrQualityCucumberTest htmlLinkLintCucumberTest tableValidationCucumberTest
              plantumlValidationCucumberTest crossBoroughCucumberTest
              translationResilienceCucumberTest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Gradle wrapper version
        uses: cccp-education/conventions-gradle/.github/actions/verify-gradle-wrapper@main
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Cucumber scenarios (shard ${{ matrix.shard }})
        run: ./gradlew ${{ matrix.tasks }}
        working-directory: document-plugin
      - name: Report failing tests
        if: failure()
        working-directory: document-plugin
        shell: bash
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            while IFS= read -r test; do
              echo "::error title=${file##*/}::${test}"
              found=1
            done < <(awk '/<testcase /{n=$0; sub(/.*name="/,"",n); sub(/".*/,"",n)} /<failure/{print n}' "$file")
          done < <(grep -rl '<failure' build/test-results 2>/dev/null || true)
          if [ "$found" -eq 0 ]; then
            echo "::error title=bdd-${{ matrix.shard }}::Build failed without a test failure (see the Gradle log)"
          fi
          exit 1

  publish-local:
    name: POM check (publishToMavenLocal)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Verify publishToMavenLocal (POM)
        run: ./gradlew publishToMavenLocal
        working-directory: document-plugin

  # DOC-CI-ISOLATION-4 — release gate. Publishing to Maven Central happens only
  # from a `v*` tag, after every test job is green, and only when a GPG key is
  # imported: Central rejects unsigned artefacts and a plain test job has no key
  # (the conventions plugin skips signing there). CCCP_PUBLISH re-enables signing
  # for this job; OSSRH secrets are materialised into ~/.gradle/gradle.properties,
  # which is where settings.gradle.kts reads them. Locked by document.ci.ReleaseWorkflow.
  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [static, unit, functional, bdd, publish-local]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Import GPG key
        id: import-gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Configure Maven Central credentials
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<EOF
          ossrhUsername=${{ secrets.OSSRH_USERNAME }}
          ossrhPassword=${{ secrets.OSSRH_PASSWORD }}
          signing.useGpgCmd=true
          signing.keyId=${{ steps.import-gpg.outputs.keyid }}
          EOF

      - name: Publish to Maven Central
        run: ./gradlew publishAggregationToCentralPortal --no-daemon
        working-directory: document-plugin
        env:
          CI: "true"
          CCCP_PUBLISH: "true"
